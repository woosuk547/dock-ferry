    <style>#splash{z-index:9999;--start:calc(max(100vw, 100vh) * .32);--end:min(44vw, 30vh, 220px);background:linear-gradient(#35befc 0%,#168cee 100%);transition:opacity .3s;position:fixed;inset:0;overflow:hidden}#splash.android{--start:150px}#splash.off{display:none}#splash:not(.go),#splash:not(.go) *{animation-play-state:paused!important}#splash.leave{opacity:0;pointer-events:none;transition-delay:.3s}.sp-boat{width:var(--end);aspect-ratio:1;transform:translate(-50%, -50%) scale(calc(var(--start) / var(--end)));animation:.55s cubic-bezier(.34,1.4,.5,1) forwards sp-in;position:absolute;top:50%;left:50%}.sp-boat img{border-radius:20%;width:100%;height:100%;animation:1.7s ease-in-out .55s infinite sp-bob;display:block;box-shadow:0 10px 26px #08285047}.sp-title{left:0;right:0;top:calc(50% - 8vh + var(--end) / 2 + 24px);text-align:center;color:#fff;white-space:nowrap;letter-spacing:.01em;text-shadow:0 3px #13293d,0 6px 14px #08285059;margin:0;font:900 clamp(34px,11vw,54px)/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;position:absolute}.sp-title span{opacity:0;animation:.42s cubic-bezier(.3,1.6,.5,1) forwards sp-pop;display:inline-block}.sp-by{left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 34px);text-align:center;color:#e9f7ff;letter-spacing:.12em;opacity:0;z-index:2;margin:0;font:700 13px/1 system-ui,-apple-system,sans-serif;animation:.5s .8s forwards sp-fade;position:absolute}.sp-dots{left:0;right:0;top:calc(50% - 8vh + var(--end) / 2 + 96px);text-align:center;opacity:0;transition:opacity .3s;position:absolute}#splash.wait .sp-dots{opacity:1}.sp-dots i{background:#fff;border-radius:50%;width:8px;height:8px;margin:0 4px;animation:1s ease-in-out infinite sp-dot;display:inline-block}.sp-dots i:nth-child(2){animation-delay:.15s}.sp-dots i:nth-child(3){animation-delay:.3s}.sp-sea{height:22vh;animation:.6s cubic-bezier(.2,.8,.3,1) .1s forwards sp-rise;position:absolute;bottom:0;left:0;right:0;transform:translateY(100%)}.sp-wave{width:200%;height:100%;animation:6s linear infinite sp-slide;position:absolute;bottom:0;left:0}.sp-wave.back{opacity:.45;animation-duration:9s;animation-direction:reverse;bottom:18px}.sp-lift,.sp-sink{width:100%;height:100%;transition:transform .38s}.sp-lift{transition:transform .45s cubic-bezier(.4,0,.8,.6)}.sp-title,.sp-by{transition:opacity .2s}.sp-sink{position:absolute;inset:0}#splash.leave .sp-lift{transform:translate(-85vw)rotate(-5deg)}#splash.leave .sp-title,#splash.leave .sp-by{opacity:0}#splash.leave .sp-sink{transform:translateY(45%)}@keyframes sp-in{to{transform:translate(-50%,calc(-50% - 8vh))scale(1)}}@keyframes sp-bob{0%,to{transform:translateY(0)rotate(-2.5deg)}50%{transform:translateY(-7px)rotate(2.5deg)}}@keyframes sp-pop{0%{opacity:0;transform:translateY(18px)scale(.6)}to{opacity:1;transform:none}}@keyframes sp-fade{to{opacity:1}}@keyframes sp-rise{to{transform:none}}@keyframes sp-slide{to{transform:translate(-50%)}}@keyframes sp-dot{0%,to{opacity:.5;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}@media (prefers-reduced-motion:reduce){#splash.leave .sp-lift{transform:none}.sp-boat{animation-duration:10ms}.sp-boat img,.sp-wave,.sp-dots i{animation:none}.sp-title span{animation-duration:10ms;animation-delay:0s!important}}</style>

      <h1 class="sp-title"><span style="animation-delay:.3s">D</span><span style="animation-delay:.34s">o</span><span style="animation-delay:.38s">c</span><span style="animation-delay:.42s">k</span>&nbsp;<span style="animation-delay:.5s">F</span><span style="animation-delay:.54s">e</span><span style="animation-delay:.58s">r</span><span style="animation-delay:.62s">r</span><span style="animation-delay:.66s">y</span></h1>

    <script>
      // 앱(네이티브)에서만 보인다 — 웹판(CrazyGames)은 자체 로딩 화면이 있어 끄고, 개발 중엔 ?splash=1로 본다.
      (function () {
        var el = document.getElementById('splash');
        var cap = window.Capacitor;
        var native = (cap && cap.isNativePlatform && cap.isNativePlatform()) || location.protocol === 'capacitor:';
        if (!native && !/[?&]splash=1/.test(location.search)) { el.className = 'off'; return; }
        else if ((cap && cap.getPlatform && cap.getPlatform() === 'android') || /Android/.test(navigator.userAgent)) el.className = 'android';
        // 아이콘 그림이 준비되면 기본 시작 화면(@capacitor/splash-screen)을 닫고 같은 순간 애니메이션을 시작한다.
        // 아래 웹 화면이 같은 자리·같은 그림이라 바뀌는 게 안 보인다. src/ui/splash.ts가 data-t(시작 시각)로 길이를 잰다.
        function go() {
          if (el.dataset.closing) return;
          el.dataset.closing = '1';
          var sp = cap && cap.Plugins && cap.Plugins.SplashScreen;
          var hide = sp && sp.hide ? sp.hide({ fadeOutDuration: 120 }) : cap && cap.nativePromise ? cap.nativePromise('SplashScreen', 'hide', { fadeOutDuration: 120 }) : null;
          function begin() { el.dataset.t = String(performance.now()); el.classList.add('go'); }
          // 안드로이드 플러그인은 닫기 전까지 앱 화면 그리기를 막아(onPreDraw false) 닫은 뒤 첫 그림까지 약 0.5초 걸린다(10/8 에뮬 녹화).
          // 그동안 멈춘 첫 장면을 두고 그 뒤에 움직인다.
          function start() { if (el.className.indexOf('android') >= 0) setTimeout(begin, 450); else begin(); }
          if (hide && hide.then) hide.then(start, start);
          else start();
        }
        // 그림이 실제로 화면에 올라온 뒤 닫는다 — decode 직후·두 프레임 뒤에도 빈 바탕이 한 프레임 보일 때가 있어(10/8 시뮬 녹화 5번 중 2번)
        // 0.12초 더 기다리고, 닫을 때도 0.12초 겹쳐 흐리게 사라지게 한다.
        function painted() { requestAnimationFrame(function () { requestAnimationFrame(function () { setTimeout(go, 120); }); }); }
        var img = el.querySelector('img');
        img.src = img.dataset.src;
        (img.decode ? img.decode() : Promise.resolve()).then(painted, painted);
        setTimeout(go, 1500);
      })();
    </script>
