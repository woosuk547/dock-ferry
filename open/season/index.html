<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-itunes-app" content="app-id=6819957171, app-argument=https://woosuk547.github.io/dock-ferry/open/season/">
<title>Dock Ferry</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; min-height: 100svh; margin: 0 auto; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; line-height: 1.5; color: #1d1d1f; background: #fff; text-align: center; }
  img.icon { width: 96px; height: 96px; margin: 0 auto; border-radius: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  h1 { margin: 16px 0 4px; }
  p { margin: 0; }
  a.open { display: block; margin: 24px 0 32px; padding: 14px 16px; border-radius: 14px; background: #0a66d8; color: #fff; font-weight: 700; font-size: 1.1rem; text-decoration: none; }
  p.note { color: #444; font-size: .95rem; margin-bottom: 8px; }
  img.badge { height: 52px; }
</style>
</head>
<body>
<img class="icon" src="../../press/img/icon-1024.jpg" alt="">
<h1>Dock Ferry</h1>
<p id="lead">A relaxing color puzzle: board each passenger onto the matching ferry.</p>
<a class="open" id="open" href="dockferry://season">Open the app</a>
<p class="note" id="note">Don&rsquo;t have it yet? It&rsquo;s free.</p>
<p><a href="https://apps.apple.com/app/id6819957171"><img class="badge" src="../../press/img/app-store-badge.svg" alt="Download on the App Store"></a></p>
<script>
  // 앱이 없거나 1.0.11 전 버전이면 이 페이지가 열린다 — 한국어 기기면 한국어로
  if ((navigator.language || '').toLowerCase().startsWith('ko')) {
    document.documentElement.lang = 'ko';
    document.getElementById('lead').textContent = '같은 색 배에 승객을 태우는 편안한 색 맞추기 퍼즐이에요.';
    document.getElementById('open').textContent = '앱 열기';
    document.getElementById('note').textContent = '아직 없으세요? 무료로 받을 수 있어요.';
  }
</script>
</body>
</html>
